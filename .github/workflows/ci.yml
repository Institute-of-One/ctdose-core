name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check ctdose_core tests tools examples paper test_ge_arm_recompute.py
      - name: Test
        run: pytest --cov=ctdose_core --cov-report=term-missing

  shipped-data-is-self-consistent:
    # Four things a downstream user can verify without any input this repository does
    # not carry: that the shipped reference tables are internally consistent, that the
    # coefficient table still matches its published CC BY 4.0 source and keeps its
    # attribution, that the committed results/ agree with the per-row data they
    # summarise, and that every number in the manuscript is re-derivable from those
    # results. Together these catch a stale results file and a manuscript figure edited
    # by hand -- the two ways a reported number could drift away from the data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: |
          pytest -q \
            tests/test_tables.py \
            tests/test_ctdi_table.py \
            tests/test_coefficient_licensing.py \
            tests/test_results_integrity.py \
            tests/test_manuscript_consistency.py
